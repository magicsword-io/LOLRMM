Name: Obliance
Category: RMM
Description: >
    Obliance is a self-hosted remote monitoring and management project with a
    Go endpoint agent. Its reviewed source provides Windows, Linux, and macOS
    installers and implements endpoint monitoring, remote shell, file,
    process, service, update, and remote-control functions. This entry records
    source-confirmed artifacts only; it does not establish a delivery
    relationship or malicious use.
Author: Michael Haag
Created: '2026-09-28'
LastModified: '2026-09-28'
Details:
    Website: https://github.com/MeeJay/Obliance
    PEMetadata:
        Filename: obliance-agent.exe
        OriginalFileName: ''
        Description: Windows MSI source names this endpoint service executable; no PE metadata was inspected.
    Privileges: Windows MSI installation creates a LocalSystem service and scheduled task; Linux and macOS installation create system services and require administrative privileges. The source was not executed.
    Free: Unknown
    Verification: >
        Static source review at commit f1eb7e886df9b16d46f13d19cec4b7d6cedcf4ac.
        Windows WiX source, Windows service source, and Unix installer source
        define the listed files, service, task, registry locations, and macOS
        LaunchDaemon. No installer, agent, server, remote session, or update
        workflow was executed. Server URLs and API keys are deployment
        configuration and are intentionally not generic network indicators.
        The reviewed repository did not provide a license file, so licensing is
        recorded as Unknown.
    SupportedOS:
        - Windows
        - Linux
        - macOS
    Capabilities:
        - Endpoint monitoring and inventory
        - Remote shell and script execution
        - File, process, and service management
        - Update and compliance management
        - Browser-mediated remote-control functions
        - Self-hosted server deployment
    Vulnerabilities: []
    InstallationPaths:
        - C:\Program Files\OblianceAgent\obliance-agent.exe
        - C:\Program Files\OblianceAgent\obliance-tray.exe
        - C:\Program Files\OblianceAgent\obliance-watchdog.exe
        - C:\ProgramData\OblianceAgent\config.json
        - C:\ProgramData\OblianceAgent\agent.log
        - C:\ProgramData\OblianceAgent\watchdog.json
        - /opt/obliance-agent/obliance-agent
        - /etc/obliance-agent/config.json
        - /etc/systemd/system/obliance-agent.service
        - /etc/systemd/system/obliance-watchdog.service
        - /Library/LaunchDaemons/com.obliance.agent.plist
        - /usr/local/bin/obliance-agent
        - /var/log/obliance-agent.log
