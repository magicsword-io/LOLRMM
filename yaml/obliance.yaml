    EventLog:
        - EventID: 7045
          ProviderName: Service Control Manager
          LogFile: System
          ServiceName: OblianceAgent
          ImagePath: C:\Program Files\OblianceAgent\obliance-agent.exe
          Description: Windows MSI source installs this automatic LocalSystem service.
          CommandLine: ''
    Registry:
        - Path: HKLM\SOFTWARE\OblianceAgent
          Description: Windows MSI writes initial ServerUrl and ApiKey values, and agent code reads them if config.json is absent. Values can contain credentials and should not be published.
        - Path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\OblianceTray
          Description: Windows MSI registers obliance-tray.exe for user-session startup.
        - Path: HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\OblianceAgent
          Description: Windows MSI and service source register the service for Safe Mode with Networking.
        - Path: HKLM\SYSTEM\CurrentControlSet\Services\OblianceAgent
          Description: Windows service configuration key inferred from the MSI ServiceInstall definition.
