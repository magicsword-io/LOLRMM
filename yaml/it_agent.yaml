Name: IT Agent
Category: RMM
Description: >
    IT Agent is a remote monitoring and management (RMM) platform. Its remote
    access capability is powered by Duet, while its separately named ITAgent RMM
    Sender components provide the broader IT Agent endpoint-management product.
    The IT Agent RMM Sender binaries are distinct from the Duet Display files
    covered by the existing Duet Display catalog entry.
Author: Michael Haag
Created: '2026-09-22'
LastModified: '2026-09-22'
