        - Filename: ITAgentSender.aiui
          OriginalFileName: ITAgentSender.aiui
          Description: ITAgent RMM Sender Installer
    Privileges: ''
    Free: ''
    Verification: >
        Vendor documentation describes IT Agent as a full RMM suite whose
        remote-access feature is powered by Duet. Reviewed metadata for three Windows RMM
        Sender components reports valid IT Agent, Inc. Authenticode signatures;
        their full-file SHA-256 values, PE metadata, original filenames, and
        the shared signer certificate were reviewed without executing the files.
        The inspected RMM Sender components are distinct from the Duet Display
        executable and installer names. The vendor documents Windows, macOS,
        and Linux support; its current platform page specifically identifies
        Apple Silicon and Intel macOS systems, plus Ubuntu, Debian, and RHEL
        Linux systems. This review has no verified macOS or Linux artifact
        names, installed paths, services, launchd labels, or network endpoints.
    SupportedOS:
        - Windows
        - macOS
        - Linux
    Capabilities:
        - Remote desktop access
        - Endpoint monitoring and alerts
        - Operating-system and application patching
        - Managed scripting
        - Policy and compliance management
