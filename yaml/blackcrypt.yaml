    PEMetadata:
        Filename: BlackCryptAgent.dll
        OriginalFileName: BlackCryptAgent.dll
        Description: BlackCrypt RMM Remote Management Agent (self-identified in PE resources)
    Privileges: Administrator required for elevated job execution; service-install requirements were not established
    Free: Unknown
    Verification: >
        A 120,769,056-byte Windows sample was downloaded for static analysis only
        and its SHA-256 was verified. Decompilation confirms a coherent custom
        endpoint-management implementation, including registration, heartbeat,
        WebSocket, terminal, command-execution, inventory, and firewall/USB
        services. Version resources claim BlackCrypt Labs Inc and version 4.2.1.35,
        but no reliable independent vendor source was found. The signed content
        digest verified locally; certificate trust validation was unsuccessful
        because the signer certificate was reported revoked. No live installation,
        remote-control session, or operator infrastructure was tested.
    SupportedOS:
        - Windows
    Capabilities:
        - Endpoint registration, heartbeat, and WebSocket job handling
        - Interactive remote terminal sessions
        - Remote PowerShell, command-shell, and batch-script execution
        - Elevated job execution through Scheduled Task as SYSTEM
        - Screenshot capture, reboot, shutdown, and re-enrollment actions
        - Software, system, USB-device, and firewall inventory
