Name: BlackCrypt RMM Agent
Category: RMM
Description: >
    BlackCrypt RMM Agent is a custom Windows endpoint-management agent whose
    compiled code implements registration, heartbeats, WebSocket job dispatch,
    interactive terminal sessions, remote command and script execution,
    inventory collection, and endpoint-management actions. The inspected sample
    self-identifies as a BlackCrypt Labs Inc product, but no independently
    verifiable publisher or product source was identified. Its signing certificate
    subject is C&P Global Investors LLC and local certificate validation reported
    that certificate as revoked. This entry documents the agent's confirmed
    functionality and observed host/network artifacts; it does not establish a
    legitimate commercial vendor, malware classification, or observed abuse.
Author: Michael Haag
Created: '2026-09-22'
LastModified: '2026-09-22'
