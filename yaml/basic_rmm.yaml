    Verification: >
        A Windows x64 Go executable was inspected statically without execution.
        Its PE metadata identifies Basic RMM Agent and its Go build information
        identifies the executable path basicrmm/cmd/agent and the basicrmm
        module. Recovered source-file and function paths establish the listed
        RMM and remote-access functions, including endpoint inventory, patches,
        shell, screen, file-transfer, process/service/registry, and self-update
        modules. The binary is unsigned. External vendor or distribution
        provenance was not established, so the Basic RMM name is a self-identity
        rather than an independently attributed vendor product.
