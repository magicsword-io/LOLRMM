Name: Basic RMM Agent
Category: RMM
Description: >
    Basic RMM Agent is an unattributed Windows remote monitoring and management
    agent. Static analysis shows endpoint inventory, patch management, remote
    interactive desktop control, shell access, file transfer, and endpoint
    administration functions. The same binary also includes keylogging,
    credential-vault collection, webcam and audio functions, and hidden virtual
    desktop support. No independent vendor, official distribution source, or
    publisher signature was established; use the product identity, hash, and
    behavior rather than the generic agent.exe filename for triage.
Author: Michael Haag
