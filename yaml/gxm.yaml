Name: GxM RMM Agent
Category: RMM
Description: >
    GxM RMM Agent is a custom Windows remote monitoring and management agent.
    Its inspected code implements enrollment, a Windows service, remote desktop
    support, shell and script execution, file operations, software and system
    inventory, patching, deployment, and endpoint administration. No independent
    vendor or source repository was identified, and the reviewed records contain
    no observed delivery-abuse relationship. This entry documents the agent's
    confirmed RMM functionality and static host artifacts; it does not establish
    a legitimate commercial vendor, malware classification, or a campaign.
Author: Michael Haag
Created: '2026-09-22'
LastModified: '2026-09-22'
Details:
    Website: ''
    PEMetadata:
        Filename: GxM.Agent.dll
        OriginalFileName: GxM.Agent.dll
        Description: GxM RMM endpoint agent — authorized remote monitoring and support for managed clients (self-identified in assembly metadata)
    Privileges: Administrator required to install the auto-starting Windows service
    Free: Unknown
    Verification: >
        A 266,752-byte .NET 8 Windows sample was downloaded for static analysis
        only and its SHA-256 was verified. Decompilation recovered a coherent
        GxM.Agent project with enrollment, service installation, SignalR command
        handling, remote-screen/input/clipboard features, shell and script
        execution, file management, inventory, patching, deployment, update, and
        endpoint-administration components. The sample is unsigned and no reliable
        independent vendor, source repository, or delivery-abuse relationship was
        identified. No live installation, remote-control session, or network
        endpoint was tested.
    SupportedOS:
        - Windows
    Capabilities:
        - Enrollment and managed endpoint registration
        - Auto-starting Windows service with restart-on-failure configuration
        - Remote screen capture, keyboard/mouse input, and clipboard operations
        - Interactive shell and remote script execution
        - Remote file read, write, delete, rename, and directory operations
        - Process and service management
        - Hardware, software, application, event-log, registry, and network inventory
        - Patch, software-deployment, update, and Wake-on-LAN actions
    Vulnerabilities: []
    InstallationPaths:
        - '*\ProgramData\GxM\agent\GxM.Agent.exe'
        - '*\ProgramData\GxM\enrollment.json'
        - '*\ProgramData\GxM\install.log'
        - C:\GxM\agent
