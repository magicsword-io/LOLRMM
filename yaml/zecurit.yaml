Name: Zecurit
Category: RMM
Description: >
    Zecurit is a cloud-based endpoint management and remote monitoring and management
    platform for Windows, macOS, and Linux. It provides unattended remote access,
    file transfer, remote commands and scripts, software deployment, patch management,
    and hardware and software inventory. A Zoom-themed phishing delivery reported
    by @patialavii used zoominstaller.exe to deliver the Zecurit Windows agent.
    The reported payload contains Zecurit management and remote-access components;
    the lure filename is not a product-specific detection artifact. Investigate
    unexpected installations against the organization's approved remote-access tools.
Author: Michael Haag
Created: '2026-09-22'
LastModified: '2026-09-22'
Details:
    Website: https://zecurit.com/
    PEMetadata: {}
    Privileges: Administrator for installation; Local System on Windows; root on macOS/Linux
    Free: true
    Verification: >
        Vendor documentation confirms the RMM capabilities and supported platforms.
        The reported installer SHA256 was verified and its embedded MSI and agent
        archive were extracted without executing the software. Windows paths,
        registry keys, and network endpoints were corroborated with execution
        reports. Extracted ZecuritAgentService.exe, ZecuritAgentRegister.exe,
        ZecuritRemoteTools.exe, and ZecuritScreenReaderService.exe have locally
        verified Authenticode signatures. The outer renamed installer's signature
        could not be validated; its embedded certificate alone does not establish
        a valid signature. Those four extracted executables have no PE version metadata.
        The phishing delivery chain is attributed to the reporter. A live remote
        session and macOS/Linux artifacts were not independently tested. Free
        Asset Manager and Remote Access editions are available alongside paid plans.
    SupportedOS:
        - Windows
        - macOS
        - Linux
    Capabilities:
        - Attended and unattended remote desktop access
        - Remote command and script execution
        - File transfer
        - Remote registry, service, and process management on Windows
        - Software deployment
        - Operating-system and application patch management
        - Hardware and software inventory
        - Endpoint monitoring and configuration management
    Vulnerabilities: []
    InstallationPaths:
        - C:\Program Files\Zecurit\Agent\ZecuritAgentService.exe
        - C:\Program Files\Zecurit\Agent\ZecuritAgentRegister.exe
        - C:\Program Files\Zecurit\Agent\ZecuritAgentTray.exe
        - C:\Program Files\Zecurit\Agent\ZecuritAgentAssetMgr.exe
        - C:\Program Files\Zecurit\Agent\ZecuritLiveNotifier.exe
        - C:\Program Files\Zecurit\Agent\ZecuritCommandProcessor.exe
        - C:\Program Files\Zecurit\Agent\ZecuritRemoteTools.exe
        - C:\Program Files\Zecurit\Agent\ZecuritScreenReaderService.exe
        - C:\Program Files\Zecurit\Agent\ZecuritScreenReaderApp.exe
        - C:\Program Files\Zecurit\Agent\ZecuritScreenReaderAppUI.exe
        - C:\Program Files\Zecurit\Agent\ZecuritApplicationControlService.exe
        - C:\Windows\Temp\Zecurit\ZecuritAgentUpgrader.exe
Artifacts:
    Disk:
        - File: '*\Zecurit\Agent\ZecuritAgentService.exe'
          Description: Windows management service executable included in the extracted agent archive.
          OS: Windows
        - File: '*\Zecurit\Agent\ZecuritAgentRegister.exe'
          Description: Agent registration executable invoked by the installer helper.
          OS: Windows
        - File: '*\Zecurit\Agent\ZecuritRemoteTools.exe'
          Description: Remote-tools component included in the extracted Windows agent archive.
          OS: Windows
        - File: '*\Zecurit\Agent\ZecuritScreenReaderService.exe'
          Description: Remote-access service component included in the extracted Windows agent archive.
          OS: Windows
        - File: '*\Zecurit\Agent\Logs\agent_service.log'
          Description: Windows agent service log observed under the installed agent directory.
          OS: Windows
          Example:
              - C:\Program Files\Zecurit\Agent\Logs\agent_service.log
        - File: '*\Zecurit\Agent\Logs\agent_cmd_handler.log'
          Description: Command-handler log observed under the installed agent directory.
          OS: Windows
        - File: '*\Zecurit\Agent\Storage\AgentSettings.json'
          Description: Agent settings file referenced by the service and observed in execution reports.
          OS: Windows
        - File: '*\Zecurit\ZecuritAgentUpgrader.exe'
          Description: Agent upgrade executable staged beneath the Windows temporary directory.
          OS: Windows
          Example:
              - C:\Windows\Temp\Zecurit\ZecuritAgentUpgrader.exe
        - File: '*\Zecurit\zecurit_windows_agent.exe'
          Description: Downloaded update installer observed with /SILENT /NORESTART arguments.
          OS: Windows
          Example:
              - C:\Windows\Temp\Zecurit\zecurit_windows_agent.exe
        - File: '*\ZecuritAgentInstaller.msi'
          Description: Embedded Windows installer package extracted by the reported Inno Setup wrapper.
          OS: Windows
          Example:
              - C:\Windows\Temp\ZecuritAgentInstaller.msi
    EventLog: []
    Registry:
        - Path: HKLM\SOFTWARE\Zecurit\Agent
          Description: >
              Windows agent configuration key. AgentDetails holds values such as
              agent_version, polling_interval, and agentDownloadURL. The product
              key is present in the extracted code and writes were observed in
              execution reports.
    Network:
        - Description: >
              Vendor application server observed in Windows agent command-line
              configuration and outbound HTTPS traffic. This host also serves the
              legitimate web console; a connection alone does not establish abuse.
          Domains:
              - app.zecurit.com
          Ports:
              - 443
        - Description: Vendor endpoint observed in the reported Windows agent's outbound HTTPS traffic.
          Domains:
              - dms.zecurit.com
          Ports:
              - 443
        - Description: >
              Specific distribution used for agent updates. An observed agentDownloadURL
              points to /agent-directory/windows-main/zecurit_agent_3.22.exe on this
              host. The shared CloudFront parent domain is not a product indicator.
          Domains:
              - d1m8kha1zyjal6.cloudfront.net
          Ports:
              - 443
