Name: RdViewer
Category: RMM
Description: >-
    RdViewer (Rd远控) is remote-control and endpoint-management software from
    Jinan Kuai'an Network Technology Co., Ltd. (济南快安网络科技有限公司).
    It supports remote screens, file transfer, terminals, batch management,
    and self-hosted relay nodes. It is unrelated to the Pierschel RdClient
    product despite the shared rdclient.exe filename. Huorong reported RdPack
    silently installing RdViewer in 2023. ESRC reported tax-notification
    phishing delivering a repackaged client in July 2026, and Rogue Authority
    separately reported fake Disk Manager installers delivering patched
    RdViewer clients in October 2026. Campaign artifacts below are not default
    installation locations or proof that all deployments are malicious.
Author: Michael Haag
Created: '2026-10-20'
LastModified: '2026-10-26'
Details:
    Website: https://www.rdviewer.com/
    PEMetadata:
        - Filename: RdServer.exe
          OriginalFileName: RdServer.exe
          Description: Server executable in the inspected official RdViewerPro archive; PE version 6.6.4.0, independent of the advertised suite version
        - Filename: RdClient.exe
          OriginalFileName: rdclient.exe
          Description: Remote-control client; the correlated July campaign sample has original filename rdclient.exe and impersonates Windows service-host version metadata
        - Filename: rdService.exe
          OriginalFileName: rdservice.exe
          Description: Windows service module; the correlated sample identifies product RdViewer 服务程序 and version 6.6.8.0
    Privileges: Windows service installation requires administrative permissions; interactive components may run as a user
    Free: Free personal and self-hosted editions; paid editions are also offered
    Verification: >-
        Identity and features verified against vendor documentation and static
        inspection of the official Windows self-hosted package. Campaign metadata
        and behaviors were corroborated using public research, VirusTotal records,
        and existing sandbox reports. Windows, macOS, Linux, Android, and iOS are
        advertised on the download page; mobile apps are described as controllers
        for Windows PCs. Unix endpoint installation paths and persistence were
        not verified. No product binaries were run locally.
    SupportedOS:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    Capabilities:
        - Remote desktop control
        - Remote terminal
        - File transfer and management
        - Clipboard synchronization
        - Screen recording and audio
        - Batch endpoint management and screen wall
        - Self-hosted relay nodes and P2P connectivity
    Vulnerabilities: []
    # The process generator strips directories for these filenames. Keep scoped
    # file artifacts below instead of emitting ambiguous rdclient.exe selectors.
    InstallationPaths: []
Artifacts:
    Disk:
        - File: 'C:\Program Files (x86)\rdviewer\rdclient\*'
          Description: Vendor-documented client directory; not established as universal across every current edition
          OS: Windows
        - File: '*\rdpro\RdClient.exe'
          Description: Client under the July campaign's rdpro directory; path suffix generalized from ESRC's reported per-user installation
          OS: Windows
        - File: '*\rdpro\rdService.exe'
          Description: Service module under the July campaign deployment directory
          OS: Windows
        - File: '*\rdpro\rdlibw.dll'
          Description: Remote-screen codec library in the July campaign client package
          OS: Windows
        - File: '*\rdpro\cfg.ini'
          Description: July campaign configuration file scoped to the reported deployment directory; the bare filename is not product-specific
          OS: Windows
        - File: '*\rdpro\host.dat'
          Description: July campaign relay configuration scoped to the reported deployment directory
          OS: Windows
        - File: 'C:\ProgramData\host\dmservice.exe'
          Description: Genuine RdViewer service renamed by the October fake Disk Manager builds; campaign-specific path
          OS: Windows
        - File: 'C:\ProgramData\host\diskmgr.exe'
          Description: Patched and relabelled RdViewer client in the October fake Disk Manager builds; campaign-specific path
          OS: Windows
        - File: 'C:\ProgramData\host\cfg.ini'
          Description: October campaign configuration file, not a vendor-default installation path
          OS: Windows
        - File: 'C:\ProgramData\host\host.dat'
          Description: October campaign relay configuration, not a vendor-default installation path
          OS: Windows
        - File: '*\RdViewerPro\RdServer.exe'
          Description: Server executable path inside the official self-hosted ZIP, not a fixed installed path
          OS: Windows
    EventLog: []
    Registry:
        - Path: 'HKLM\SYSTEM\CurrentControlSet\Services\Rd_Service'
          Description: RdViewer Windows service key; existing sandbox records show Services\Rd_Service under ControlSet001, normalized here to CurrentControlSet
    Network:
        - Description: Official software download host linked by the vendor; this is not evidence of a remote-control session, and self-hosted deployments can use other infrastructure
          Domains:
              - rdviewer.oss-cn-hangzhou.aliyuncs.com
          Ports:
              - 443
    Other:
        - Type: ServiceName
          Value: Rd_Service; vendor-documented as rd_service and corroborated by public research and existing sandbox reports
        - Type: ReportedServiceDisplayName
          Value: RdViewer Client Service; July ESRC campaign display name, not established as the vendor default
        - Type: ReportedCampaignServiceDisplayName
          Value: DMService; October fake Disk Manager campaign display name, not the actual service name or a vendor default
        - Type: ReportedCampaignEndpoint
          Value: 204.194.54.118:7788; ESRC's narrative and IOC table agree on port 7788, while its decrypted-configuration table prints 778. July campaign infrastructure, not a vendor default; excluded from DNS-domain indicators.
        - Type: ReportedCampaignEndpoint
          Value: 1.14.146.76:7790; October fake Disk Manager build 1 relay reported by Rogue Authority and corroborated by an existing VirusTotal CAPE record; not a vendor default; excluded from DNS-domain indicators.
        - Type: ReportedCampaignEndpoint
          Value: 103.64.13.103:7788; October fake Disk Manager build 2 relay corroborated by an existing VirusTotal CAPE record. The report also lists ports 7777 and 7799; only 7788 was independently observed in that record. Not a vendor default; excluded from DNS-domain indicators.
        - Type: ReportedDropperMD5
