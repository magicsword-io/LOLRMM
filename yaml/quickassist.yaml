Details:
    Website: 'https://support.microsoft.com/windows/solve-pc-problems-remotely-using-quick-assist-b077e31a-16f4-2529-1a47-21f6a9040bf3'
    PEMetadata:
        Filename: ''
        OriginalFileName: ''
        Description: ''
    Privileges: User; the recipient must consent to screen sharing and separately approve control
    Free: 'Yes'
    Verification: Vendor documentation and published campaign research; historical self-issued certificate identities were excluded because they do not establish Microsoft publisher identity
    SupportedOS:
        - Windows
    Capabilities:
        - Remote screen sharing
        - Remote desktop control
        - Screen annotation
    Vulnerabilities: []
    InstallationPaths:
        - quickassist.exe
        - C:\Windows\System32\QuickAssist.exe
Artifacts:
    Disk:
        - File: C:\Windows\System32\QuickAssist.exe
          Description: Legacy Windows Quick Assist executable location; the current version is distributed through Microsoft Store
          OS: Windows
    EventLog: []
    Registry: []
    Network:
