Name: Quick Assist
Category: RAT
Description: >
    Quick Assist is a Microsoft remote assistance tool that enables a user to share
    their Windows device with another person over a remote connection for
    troubleshooting. A separate macOS offering is limited to Microsoft Support
    interactions. Microsoft documented Storm-1811's abuse of Quick Assist in social
    engineering attacks beginning mid-April 2024. Microsoft observed Teams messages
    and calls impersonating IT or help desk personnel from late May 2024. Arctic
    Wolf observed Quick Assist as the most frequently abused tool in their analysis of
    400+ Microsoft Teams vishing incidents, often followed by installation of commercial
    RMM tools for persistence.
Author: ''
