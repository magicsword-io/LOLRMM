Name: Vicarius vRx
Category: RMM
Description: 'Vicarius vRx is a commercial vulnerability remediation and patch management platform with agents for Windows, Linux and macOS. Its vScript engine remotely executes custom PowerShell, Bash and Batch scripts on managed assets. Huntress reported that in one INC Ransom intrusion, a scheduled task pointed to C:\Program Files\7-Zip\HealthUpdater.exe, a renamed vRx executable placed in an unusual folder.'
Author: Liran Ravich, Cribl
Created: '2026-10-01'
LastModified: '2026-10-05'
