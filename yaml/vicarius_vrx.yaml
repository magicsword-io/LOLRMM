Name: Vicarius vRx
Category: RMM
Description: 'Vicarius vRx is a commercial vulnerability remediation and patch management platform with agents for Windows, Linux and macOS. Huntress reported that in one INC Ransom intrusion, a scheduled task pointed to C:\Program Files\7-Zip\HealthUpdater.exe, a renamed vRx executable placed in an unusual folder.'
Author: Liran Ravich, Cribl
Created: '2026-10-01'
LastModified: '2026-10-01'
Details:
    Website: 'https://www.vicarius.io'
    PEMetadata:
        Filename: ''
        OriginalFileName: ''
        Description: ''
    Privileges: ''
    Free: false
    Verification: ''
    SupportedOS:
        - Windows
        - Linux
        - macOS
    Capabilities:
        - Vulnerability remediation
        - Patch deployment
        - Script execution
        - Software deployment
    Vulnerabilities: []
    InstallationPaths:
        - 'C:\Program Files\Vicarius\Topia\*'
        - '/usr/share/vicarius/*'
Artifacts:
