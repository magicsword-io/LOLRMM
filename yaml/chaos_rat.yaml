    Privileges: No default service or persistence installer was established in the pinned upstream client source.
    Free: true
    Verification: >
        Static review of pinned upstream source and Acronis public reporting;
        no local binary, controller, or sample execution was performed. The
        client generation service establishes Windows and Linux targets. The
        report documents malicious Linux samples but does not establish their
        delivery method.
    SupportedOS:
        - Windows
        - Linux
    Capabilities:
        - Self-hosted controller and configured endpoint generation
        - Remote command handling
        - File transfer
        - System information collection
