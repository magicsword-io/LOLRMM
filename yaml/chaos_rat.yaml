Name: CHAOS RAT
Category: RAT
Description: >
    CHAOS RAT is an open-source Go remote-access framework with a self-hosted
    controller that creates configured Windows and Linux clients. Its client
    connects to an operator-selected controller for remote command handling.
    Acronis has documented malicious CHAOS RAT Linux samples; the upstream
    project itself is dual-use.
Author: Michael Haag
Created: '2026-09-28'
LastModified: '2026-09-28'
