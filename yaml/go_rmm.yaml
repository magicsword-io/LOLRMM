Name: GO RMM
Category: RMM
Description: >
    GO RMM is a custom Windows management console that builds and controls remote
    agents. The inspected Go/Wails console includes agent enrollment and build
    controls, WebSocket command handling, remote desktop and input, shell, file,
    inventory, process, and session-management workflows. Its embedded interface
    also exposes high-risk modules such as webcam, microphone, and keylogging, as
    well as disruptive operations including a forced system crash. This entry
    records the console's statically demonstrated remote-administration functions;
    it does not establish a verified publisher, commercial vendor, malware
    classification, or observed abuse.
