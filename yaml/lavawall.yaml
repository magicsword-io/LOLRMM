          Value: d494ac927c3a98f67a035a418c5e89e9a97397a837fb8cc9bedbb44d25ad3670
        - Type: ObservedUIHelperSHA256
          Value: 3c56c3cca03efdcd2044a48d588ab27f68fa1b7e577874a490ff4ada241cec3e
