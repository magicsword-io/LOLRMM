Name: N-able N-central
Category: RMM
Description: N-able N-central is a remote monitoring and management (RMM) platform used by MSPs and IT teams. It has two Windows agents, the classic Windows Agent and the newer MSP Agent, which can run commands, execute scripts and deploy software on managed endpoints. CISA added CVE-2026-86218, a static code injection flaw in the N-central server, to its Known Exploited Vulnerabilities catalog on 2026-09-08.
Author: Liran Ravich, Cribl
