Name: Ping32
Category: RMM
Description: |
    Ping32 is a Windows remote monitoring and management (RMM) agent sold by
    Shandong Anzai Information Technology (NSecsoft) as an enterprise endpoint management suite,
    covering live screen monitoring, screen recording, file and document backup, software
    deployment and access control.

    Genuine vendor builds are being repurposed by threat actors. Netresec documented a June 2026
    campaign that delivered a modified Ping32 agent (`NSecRTS.exe`) through WhatsApp direct messages
    impersonating ManageEngine Endpoint Central. The campaign's C2 server also carried ValleyRAT
    traffic. Netresec notes a possible connection to the Silver Fox cluster but considers the
    evidence insufficient for confident attribution.

    Earlier abuse dates to 2019. Qianxin reported malware that downloaded and installed the agent
    into `C:\Program Files\Common Files\NSEC\`, together with a filesystem minifilter driver
    (`nFsFlt32.sys`) whose process-creation callback blocks attempts to terminate `NSecRTS.exe`.
Author: '@cyberbuff'
Created: '2026-10-11'
LastModified: '2026-10-11'
Details:
    Website: https://www.nsecsoft.com/
    PEMetadata:
        - Filename: NSecRTS.exe
          OriginalFileName: NSecRTS.exe
          Description: Ping32 remote management agent main binary; the name used by the malicious build observed in the 2026 campaign.
        - Filename: PCinfo.dll
          OriginalFileName: PCinfo.dll
          Description: Host information collection module shipped with the Ping32 agent (hardware, local accounts, OS version, disk size).
        - Filename: nFsFlt32.sys
          OriginalFileName: nFsFlt32.sys
          Description: Filesystem minifilter driver installed by the agent to guard the agent process against termination.
        - Filename: NSecDs.exe
          OriginalFileName: NSecDs.exe
          Description: Executable observed alongside NSecRTS.exe in Ping32 installs.
        - Filename: NSOutlookAddin32.dll
          OriginalFileName: NSOutlookAddin32.dll
          Description: Ping32 Outlook add-in.
    Privileges: null
    Free: false
    Verification: >
        The vendor offers a 7-day trial after phone verification and generates client installers
        from its console (Qianxin). The build documented by Netresec was staged by a VBScript
        dropper rather than obtained from the vendor.
    SupportedOS:
        - Windows
    Capabilities:
        - Live screen monitoring and screen recording
        - Employee web-browsing activity monitoring
        - Network traffic monitoring
        - File and document backup / centralisation
        - Software deployment and file push to endpoints
        - Access control policy enforcement
        - Host inventory collection (hardware, local accounts, OS version, disk size)
    Vulnerabilities: []
    InstallationPaths:
        - C:\Program Files\Common Files\NSEC\
        - C:\Program Files\Common Files\NSEC\NSecRTS.exe
        - C:\Program Files\Common Files\NSEC\PCinfo.dll
Artifacts:
    Disk:
        - File: C:\Program Files\Common Files\NSEC\NSecRTS.exe
          Description: Ping32 remote management agent main binary. The agent directory is hidden and access restricted at standard privilege.
          OS: Windows
        - File: C:\Program Files\Common Files\NSEC\PCinfo.dll
          Description: Host information collection module used to enumerate hardware, local accounts, OS version and disk size.
          OS: Windows
        - File: nFsFlt32.sys
          Description: Filesystem minifilter driver shipped with the agent. Registers a process-creation callback that blocks attempts to terminate NSecRTS.exe.
          OS: Windows
        - File: NSecDs.exe
          Description: Executable observed alongside NSecRTS.exe in Ping32 installs.
          OS: Windows
        - File: NSOutlookAddin32.dll
          Description: Ping32 Outlook add-in.
          OS: Windows
    EventLog: []
    Registry: []
    Network:
        - Description: |
            Ping32 agents are pointed at an operator-supplied server, so there is no fixed vendor C2.
            The vendor operates a cloud service on port 8987 that agents query to resolve the
            address of their server.
          Domains:
              - cloud.nsecsoft.com
          Ports:
              - 8987
    Other:
        - Type: URL
          Value: http://cloud.nsecsoft.com:8987/ndns/<SUFFIX>
Detections:
    - Sigma: https://github.com/magicsword-io/LOLRMM/blob/main/detections/sigma/ping32_network_sigma.yml
      Description: Detects potential network activity of Ping32 RMM tool
    - Sigma: https://github.com/magicsword-io/LOLRMM/blob/main/detections/sigma/ping32_files_sigma.yml
