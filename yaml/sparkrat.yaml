Name: SparkRAT
Category: RAT
Description: >
    SparkRAT (Spark) is an open-source Go remote-access framework with a
    self-hosted controller that generates configured endpoint clients. It offers
    remote terminal, desktop, screenshot, file, and process functions. Public
    reporting has documented malicious SparkRAT deployments; that does not make
    every deployment of the upstream dual-use project malicious.
Author: Michael Haag
Created: '2026-09-28'
LastModified: '2026-09-28'
Details:
    Website: https://github.com/XZB-1248/Spark
    PEMetadata:
        Filename: ''
        OriginalFileName: ''
        Description: ''
    Privileges: Elevated privileges may be required for OS power actions; the upstream client has no fixed default service or persistence installer.
    Free: true
    Verification: >
        Static review of pinned upstream source and public incident reporting;
        no local binary, controller, or sample execution was performed. The
        pinned upstream client build script establishes Windows and Linux builds.
        Hunt.io documents malicious macOS SparkRAT activity, including the
        campaign-specific artifacts recorded below; it does not establish a
        default upstream macOS installer or persistence path.
    SupportedOS:
        - Windows
        - Linux
        - macOS
    Capabilities:
        - Self-hosted controller and configured endpoint generation
        - Remote terminal
        - Remote desktop and screenshots
        - File management
        - Process management
    Vulnerabilities: []
    InstallationPaths: []
Artifacts:
    Disk:
        - File: /Users/shared/pull.bin
          Description: Campaign-specific downloaded SparkRAT client location documented by Hunt.io; not an upstream default path.
          OS: macOS
        - File: /Users/run/com.second.startup.plist
          Description: Campaign-specific LaunchAgent-style persistence artifact documented by Hunt.io; not an upstream default path.
          OS: macOS
    EventLog: []
    Registry: []
    Network:
        - Description: Endpoint connection values are generated per deployment and point to an operator-configured controller; no vendor domain is inherent to SparkRAT.
          Domains: []
          Ports: []
    Other:
        - Type: ConfiguredWebSocketRoute
          Value: /ws
        - Type: ConfiguredUpdateRoute
          Value: /api/client/update
        - Type: ClientUserAgentPrefix
          Value: 'SPARK COMMIT: '
        - Type: ControllerDefaultListenAddress
          Value: ':8000'
