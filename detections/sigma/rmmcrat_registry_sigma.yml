title: Potential RMMCRAT RMM Tool Registry Activity
id: 1bd58c8c-5167-5b41-bd9f-35c68cf16791
status: experimental
description: |
    Detects potential registry activity of RMMCRAT RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-23
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: registry_event
detection:
    selection:
        TargetObject|contains: 'HKLM\SYSTEM\CurrentControlSet\Services\RMMAgent'
    condition: selection
falsepositives:
    - Legitimate use of RMMCRAT
level: medium
