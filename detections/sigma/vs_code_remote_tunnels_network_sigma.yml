title: Potential VS Code Remote Tunnels RMM Tool Network Activity
id: ce5264b9-0a03-5738-9b97-2171bfdbe395
status: experimental
description: |
    Detects potential network activity of VS Code Remote Tunnels RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-10-20
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname|endswith: 'global.rel.tunnels.api.visualstudio.com'
    condition: selection
falsepositives:
    - Legitimate use of VS Code Remote Tunnels
level: medium
