title: Potential NetMaster RMM Tool Process Activity
id: e1c52273-61a5-548c-814a-1fe21f478a17
status: experimental
description: |
    Detects potential processes activity of NetMaster RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-29
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\\NetMaster_Client.exe'
    selection_image:
        Image|endswith: '\\NetMaster_Client.exe'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of NetMaster
level: medium
