title: Potential GetScreen RMM Tool Network Activity
id: c428ba60-3aba-4069-b9df-793995564173
status: experimental
description: |
    Detects potential network activity of GetScreen RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.getscreen.me'
            - '*.getscreen.me.'
            - '*.go.getscreen.me'
            - '*.go.getscreen.me.'
            - '*.image.getscreen.me'
            - '*.image.getscreen.me.'
            - 'getscreen.me'
            - 'getscreen.me.'
            - 'go.getscreen.me'
            - 'go.getscreen.me.'
            - 'image.getscreen.me'
            - 'image.getscreen.me.'
            - 'px-*.getscreen.me'
            - 'px-*.getscreen.me.'
    condition: selection
falsepositives:
    - Legitimate use of GetScreen
level: medium
