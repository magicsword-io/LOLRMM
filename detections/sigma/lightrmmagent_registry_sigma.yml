title: Potential LightRmmAgent RMM Tool Registry Activity
id: 55df44e5-0289-5ac7-9000-c1d5a1d95901
status: experimental
description: |
    Detects potential registry activity of LightRmmAgent RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-23
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: registry_event
detection:
    selection:
        TargetObject|contains: 'HKLM\SYSTEM\CurrentControlSet\Services\LightRmmAgent'
    condition: selection
falsepositives:
    - Legitimate use of LightRmmAgent
level: medium
