title: Potential BlackCrypt RMM Agent RMM Tool Registry Activity
id: a021febd-4c84-5cb5-9d6b-53d0a2e872dc
status: experimental
description: |
    Detects potential registry activity of BlackCrypt RMM Agent RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-23
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: registry_event
detection:
    selection:
        TargetObject|contains: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\BlackCryptAgent'
    condition: selection
falsepositives:
    - Legitimate use of BlackCrypt RMM Agent
level: medium
