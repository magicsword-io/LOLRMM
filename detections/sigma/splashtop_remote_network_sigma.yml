title: Potential Splashtop Remote RMM Tool Network Activity
id: 95772d6f-0c1d-4515-9779-85824ee59269
status: experimental
description: |
    Detects potential network activity of Splashtop Remote RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.api.splashtop.com'
            - '*.api.splashtop.com.'
            - '*.api.splashtop.eu'
            - '*.api.splashtop.eu.'
            - '*.relay.splashtop.com'
            - '*.relay.splashtop.com.'
            - '*.splashtop.com'
            - '*.splashtop.com.'
            - 'splashtop.com'
            - 'splashtop.com.'
    condition: selection
falsepositives:
    - Legitimate use of Splashtop Remote
level: medium
