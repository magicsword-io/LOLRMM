title: Potential rdp2tcp RMM Tool Process Activity
id: 0037520d-ea12-4f04-94be-90c31c240a87
status: experimental
description: |
    Detects potential processes activity of rdp2tcp RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-09-02
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\\rdp2tcp.exe'
    selection_image:
        Image|endswith: '\\rdp2tcp.exe'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of rdp2tcp
level: medium
