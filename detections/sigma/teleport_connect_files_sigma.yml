title: Potential Teleport Connect RMM Tool File Activity
id: 5a1d8c3e-9f2b-47e6-b4a0-6c8d2e1f7a3b
status: experimental
description: |
    Detects potential files activity of Teleport Connect RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-07-29
tags:
    - attack.execution
    - attack.t1219
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFilename|contains:
            - '\Program Files\Teleport Connect\Teleport Connect.exe'
            - '\Program Files\Teleport Connect\resources\bin\tsh.exe'
            - '\AppData\Roaming\Teleport Connect\certs\'
            - '\AppData\Local\Teleport Connect\'
            - '/opt/teleport/system/bin/teleport'
            - '/usr/local/bin/teleport'
            - '/usr/local/bin/tsh'
            - '/usr/local/bin/tctl'
            - '/usr/local/bin/tbot'
            - '/usr/local/bin/teleport-update'
            - '/etc/apt/sources.list.d/teleport.list'
            - '/etc/apt/keyrings/teleport-archive-keyring.asc'
    condition: selection
falsepositives:
    - Legitimate use of Teleport Connect
level: medium
