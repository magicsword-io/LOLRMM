title: Potential Allocentra RMM Tool File Activity
id: 7b4ecdf0-6858-5e74-9e1b-5e7ae049f843
status: experimental
description: |
    Detects potential files activity of Allocentra RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-23
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFilename|endswith:
            - '*\allocentra\agent\allocentra-agent.exe'
            - '*\allocentra-update.bat'
    condition: selection
falsepositives:
    - Legitimate use of Allocentra
level: medium
