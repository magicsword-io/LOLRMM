title: Potential LogMeIn rescue RMM Tool Network Activity
id: 4eaa85dd-e3db-4410-bd7f-89c855f69d39
status: experimental
description: |
    Detects potential network activity of LogMeIn rescue RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.logmeinrescue.com'
            - '*.logmeinrescue.com.'
            - '*.logmeinrescue.eu'
            - '*.logmeinrescue.eu.'
            - '*.rescue-data-cetner.logmein-gateway.com'
            - '*.rescue-data-cetner.logmein-gateway.com.'
            - 'logmeinrescue.com'
            - 'logmeinrescue.com.'
            - 'rescue-data-cetner.logmein-gateway.com'
            - 'rescue-data-cetner.logmein-gateway.com.'
            - 'rescue-list.*.logmein-gateway.com'
            - 'rescue-list.*.logmein-gateway.com.'
    condition: selection
falsepositives:
    - Legitimate use of LogMeIn rescue
level: medium
