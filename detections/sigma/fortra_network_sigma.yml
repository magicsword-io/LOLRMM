title: Potential Fortra RMM Tool Network Activity
id: b3f40b79-9a7a-4d17-9f43-cd0bb0de7e55
status: experimental
description: |
    Detects potential network activity of Fortra RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.fortra.com'
            - '*.fortra.com.'
            - 'fortra.com'
            - 'fortra.com.'
    condition: selection
falsepositives:
    - Legitimate use of Fortra
level: medium
