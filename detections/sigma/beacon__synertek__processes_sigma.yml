title: Potential Beacon (Synertek) RMM Tool Process Activity
id: be949acb-254a-5112-80b2-c35f36a3803d
status: experimental
description: |
    Detects potential processes activity of Beacon (Synertek) RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-29
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\\beacon-agent.exe'
    selection_image:
        Image|endswith: '\\beacon-agent.exe'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of Beacon (Synertek)
level: medium
