title: Potential Teleport Connect RMM Tool Process Activity
id: 2b7e4d9f-1c8a-43f5-a6e2-9d0b3f7c5a1e
status: experimental
description: |
    Detects potential processes activity of Teleport Connect RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-07-29
tags:
    - attack.execution
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\Teleport Connect.exe'
            - '\tsh.exe'
            - '/teleport'
            - '/tsh'
            - '/tctl'
            - '/tbot'
            - '/teleport-update'
    selection_parent:
        ParentImage|endswith:
            - '\Teleport Connect.exe'
            - '\tsh.exe'
            - '/teleport'
            - '/tsh'
    selection_commandline:
        CommandLine|contains:
            - 'tsh.exe" daemon start'
            - 'tsh.exe" vnet-install-service'
            - 'tsh.exe" connect-updater'
            - 'teleport version'
            - 'teleport configure'
            - 'teleport-update link-package'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of Teleport Connect
level: medium
