title: Potential ScreenConnect RMM Tool Process Activity
id: 3c95a0d7-14e3-4464-90a1-234b5a686fac
status: experimental
description: |
    Detects potential processes activity of ScreenConnect RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-09-02
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\\ScreenConnect.ClientService.exe'
            - '\\Remote Workforce Client.exe'
            - '\\ScreenConnect.WindowsClient.exe'
            - '\\screenconnect*.exe'
            - '\\ConnectWiseControl*.exe'
            - '\\connectwise*.exe'
    selection_image:
        Image|endswith:
            - '\\ScreenConnect.ClientService.exe'
            - '\\Remote Workforce Client.exe'
            - '\\ScreenConnect.WindowsClient.exe'
            - '\\screenconnect*.exe'
            - '\\ConnectWiseControl*.exe'
            - '\\connectwise*.exe'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of ScreenConnect
level: medium
