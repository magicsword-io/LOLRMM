title: Potential MSP360 RMM Tool Network Activity
id: 8340427d-d94f-4325-8c8c-1a0d97343214
status: experimental
description: |
    Detects potential network activity of MSP360 RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.cloudberrylab.com'
            - '*.cloudberrylab.com.'
            - '*.msp360.com'
            - '*.msp360.com.'
            - '*.mspbackups.com'
            - '*.mspbackups.com.'
            - 'msp360.com'
            - 'msp360.com.'
    condition: selection
falsepositives:
    - Legitimate use of MSP360
level: medium
