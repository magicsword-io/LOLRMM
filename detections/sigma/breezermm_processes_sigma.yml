title: Potential BreezeRMM RMM Tool Process Activity
id: 98066962-2436-5b7f-a54e-68cb99aa3cb6
status: experimental
description: |
    Detects potential processes activity of BreezeRMM RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-09-23
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\\PixoIT-agent.exe'
    selection_image:
        Image|endswith: '\\PixoIT-agent.exe'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of BreezeRMM
level: medium
