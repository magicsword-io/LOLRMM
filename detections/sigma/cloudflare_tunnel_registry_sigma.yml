title: Potential CloudFlare Tunnel RMM Tool Registry Activity
id: c8026087-af6a-51fa-a27b-a80c15fd9e8d
status: experimental
description: |
    Detects potential registry activity of CloudFlare Tunnel RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2026-10-05
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: registry_event
detection:
    selection:
        TargetObject|contains:
            - 'HKLM\SYSTEM\CurrentControlSet\Services\Cloudflared'
            - 'HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Application\Cloudflared'
    condition: selection
falsepositives:
    - Legitimate use of CloudFlare Tunnel
level: medium
