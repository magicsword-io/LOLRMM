title: Potential SuperOps RMM Tool Network Activity
id: 79d52531-1c2f-4ca7-9625-c5bb6c5db1e2
status: experimental
description: |
    Detects potential network activity of SuperOps RMM tool
references:
    - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
modified: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        DestinationHostname:
            - '*.serv.superopsalpha.com'
            - '*.serv.superopsalpha.com.'
            - '*.superops.ai'
            - '*.superops.ai.'
            - '*.superopsalpha.com'
            - '*.superopsalpha.com.'
            - '*.superopsbeta.com'
            - '*.superopsbeta.com.'
            - 'serv.superopsalpha.com'
            - 'serv.superopsalpha.com.'
            - 'superops.ai'
            - 'superops.ai.'
    condition: selection
falsepositives:
    - Legitimate use of SuperOps
level: medium
