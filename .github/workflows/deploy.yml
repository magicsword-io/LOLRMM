name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'yaml/**'
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

# PR validation cannot cancel or publish a production deployment.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ENABLE_ANALYTICS: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install 'pyyaml>=6.0,<7'
      - name: Verify release boundaries
        run: python -m unittest discover -s tests -p 'test_release_workflows.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - name: Check and build production site
        run: npm run check && npm run build
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Test the production artifact
        run: npm test
        working-directory: website
      - name: Record artifact source
        run: |
          printf '%s\n' "$GITHUB_SHA" > website/dist/source-revision.txt
          echo "Validated Astro production artifact for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
